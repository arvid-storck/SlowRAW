id: io.github.arvid-storck.SlowRAW

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: SlowRAW
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin

modules:
  - name: SlowRAW
    buildsystem: simple
    sources:
      - type: dir
        path: ..

      # Prefetched by Flatpak so the Rust build needs no network access.
      - type: file
        url: https://downloads.sourceforge.net/project/exiftool/Image-ExifTool-13.60.tar.gz
        sha256: c8e3c42576f46d862e4cd9c192989776e7363931e890c95056bcd6293e83ea36
        dest-filename: exiftool-source.tar.gz

      - node-sources.json
      - cargo-sources.json

    build-options:
      env:
        CARGO_HOME: /run/build/SlowRAW/cargo
        XDG_CACHE_HOME: /run/build/SlowRAW/flatpak-node/cache
        npm_config_cache: /run/build/SlowRAW/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      - node scripts/update-exiftool.mjs --ensure --platform linux --archive exiftool-source.tar.gz
      - npm ci --offline --legacy-peer-deps
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - npm run --offline tauri build -- --no-bundle

      - install -Dm644 -t /app/share/metainfo/ data/io.github.arvid-storck.SlowRAW.metainfo.xml
      - install -Dm644 -t /app/share/applications/ data/io.github.arvid-storck.SlowRAW.desktop
      - install -Dm755 -t /app/bin/ src-tauri/target/release/SlowRAW

      - desktop-file-edit --set-key=Icon --set-value="io.github.arvid-storck.SlowRAW" /app/share/applications/io.github.arvid-storck.SlowRAW.desktop

      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.arvid-storck.SlowRAW.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.arvid-storck.SlowRAW.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.arvid-storck.SlowRAW.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/256x256@2/apps/io.github.arvid-storck.SlowRAW.png

      - mkdir -p /app/lib/SlowRAW
      - cp -rf src-tauri/resources /app/lib/SlowRAW

      - install -Dm644 LICENSE /app/share/licenses/io.github.arvid-storck.SlowRAW/LICENSE
