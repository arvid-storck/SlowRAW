[package]
authors = ["Daniel Vogelbacher <daniel@chaospixel.com>", "Pedro Côrte-Real <pedro@pedrocr.net>"]
categories = ["multimedia::images"]
description = "A library to extract images and metadata from camera raw formats"
edition = "2024"
homepage = "https://github.com/dnglab/dnglab"
keywords = ["camera", "raw"]
license = "LGPL-2.1"
name = "rawler"
repository = "https://github.com/dnglab/dnglab"
rust-version = "1.89"
version = "0.8.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[features]
default = ["crx"]
# Canon CR3/CRM (CRX) decompressor
crx = []
# This is a developer feature, it enabled deep inspection of algorithm execution stages
clap = ["dep:clap"]
inspector = []
# Download sample files of rawdb.dnglab.org into a local cache. Examples, tests
# and benchmarks of rawler enable it by the dev-dependency on rawler itself.
rawdb = ["dep:ureq", "dep:percent-encoding", "dep:fs4"]
# Test all rawdb samples against the snapshots in data/testdata/rawdb (downloads ~100 GiB)
rawdb-tests = ["rawdb"]

[dependencies]
backtrace = "0.3"
bitstream-io = "4.1"
byteorder = "1"
chrono = "0.4"
clap = {version = "4.4.0", optional = true}
dirs = "6"
enumn = "0.1"
fs4 = {version = "1.1", default-features = false, optional = true}
hex = "0.4"
image = {version = "0.25", default-features = false, features = ["jpeg"]}
itertools = "0.14"
half = "2"
jxl-oxide = "0.12.3"
lazy_static = "1"
libflate = "2.0"
libloading = "0.8"
log = "0.4"
md5 = "0.8"
memmap2 = "0.9.4"
moxcms = {version = "0.8", default-features = false}
multiversion = "0.8"
num = "0.4"
num_enum = "0.7"
percent-encoding = {version = "2", optional = true}
rayon = "1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_arrays = "0.2.0"
thiserror = "2.0"
toml = "0.8"
ureq = {version = "2", default-features = false, features = ["tls"], optional = true}
uuid = {version = "1.0", features = ["serde", "v4"]}
weezl = "0.1.7"
zerocopy = {version = "0.8.26", features = ["derive"]}

[build-dependencies]
blake3 = "1.8.7"
glob = "0.3"
tempfile = "3.27.0"
toml = "0.8"
